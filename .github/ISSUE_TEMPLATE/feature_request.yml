name: Feature request
description: Suggest a feature, an improvement, or a new use case.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation in your own words. Skip the proposed solution for now.
      placeholder: |
        I run multiple Claude sessions in parallel and lose track of which one
        is approaching the 5h rate limit. By the time I notice, I'm already
        blocked.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: One or more concrete options. It's fine if you don't know which is best.
      placeholder: |
        Toast notification when any session crosses 80% of the 5h limit, with
        a configurable threshold.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Have you tried existing settings, scripts, or other tools? What did/didn't work?
      placeholder: |
        I tried watching the widget manually, but it's not always visible.
        I tried the `5h` line in the statusline but Claude Code has to be
        in the foreground for me to see it.
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: How important is this for your workflow?
      options:
        - Nice to have
        - Would use it regularly
        - Blocking my main use case
    validations:
      required: true
